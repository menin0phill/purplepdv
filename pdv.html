<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpg" href="./logo-purple.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>Purple PDV - Frente de Caixa e Gestão</title>
    <meta name="description" content="Sistema de Ponto de Venda (PDV) e controle de estoque premium para a Purple Cosméticos e Maquiagem." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json" />
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <!-- Cloudflare Turnstile CAPTCHA API -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
  </head>
  <body>
    <script>
      window.addEventListener('error', e => {
        if (window.require) {
          window.require('fs').writeFileSync('CRASH.txt', e.message + '\\n' + (e.error ? e.error.stack : ''));
        }
      });
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js?v=2"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('PWA Service Worker registrado!'))
            .catch(err => console.error('Erro ao registrar Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
